name: Dependency advisories

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Network-dependent advisory checks
    runs-on: forgejo-workstation
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # checkout v5, Node 24
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: https://github.com/shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Composer advisory audit
        run: composer audit --locked --no-interaction

      - name: npm production advisory audit
        run: npm audit --omit=dev --audit-level=high
