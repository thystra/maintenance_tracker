name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.5'

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring, xml, xmlwriter
          tools: composer:v2

      - name: Validate metadata and dependencies
        run: |
          composer validate --strict
          php -r 'new SimpleXMLElement(file_get_contents("appinfo/info.xml"));'

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP checks
        run: composer test

  frontend-and-integration:
    name: Frontend, package, and Nextcloud 34
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: |
          npm run validate:profiles
          npm run typecheck
          npm run lint
          npm run stylelint
          npm audit --omit=dev
          npm run build
          test -f js/maintenance_tracker-main.mjs
          test -f css/maintenance_tracker-main.css

      - name: Test in Nextcloud 34
        run: bash tests/integration/nextcloud34-smoke.sh

      - name: Build unsigned install candidate
        run: |
          mkdir -p build/stage
          git archive --format=tar --prefix=maintenance_tracker/ HEAD \
            | tar -xf - -C build/stage
          cp -R js css build/stage/maintenance_tracker/
          tar -C build/stage -czf build/maintenance_tracker-unsigned.tar.gz maintenance_tracker
          test -f build/stage/maintenance_tracker/appinfo/info.xml
          test -f build/stage/maintenance_tracker/js/maintenance_tracker-main.mjs
          test ! -e build/stage/maintenance_tracker/src
          test ! -e build/stage/maintenance_tracker/tests
          test ! -e build/stage/maintenance_tracker/package.json

      - name: Upload unsigned install candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance_tracker-unsigned
          path: build/maintenance_tracker-unsigned.tar.gz
          archive: false
          if-no-files-found: error
